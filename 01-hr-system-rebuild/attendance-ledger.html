<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考勤台账</title>
  <link rel="stylesheet" href="../shared/prototype.css">
  <style>
    /* ── 工具栏 ── */
    .cal-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
    .view-toggle{display:flex;border:1px solid #dfe5ec;border-radius:6px;overflow:hidden;}
    .vbtn{height:34px;padding:0 16px;border:none;border-right:1px solid #dfe5ec;background:#fff;color:#5f7080;font:inherit;font-size:13px;cursor:pointer;transition:background .12s,color .12s;}
    .vbtn:last-child{border-right:none;}
    .vbtn:hover{background:#f0f5f7;}
    .vbtn.active{background:#00AAB7;color:#fff;}

    /* ── Gantt 视图（月/周共用） ── */
    .gantt-outer{overflow-x:auto;border:1px solid #dfe5ec;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);}
    .gantt-inner{display:table;width:max-content;min-width:100%;}
    .gantt-hrow{display:flex;position:sticky;top:0;z-index:4;background:#f8fafc;border-bottom:1px solid #dfe5ec;}
    .gantt-name-hdr{flex-shrink:0;width:130px;padding:10px 14px;border-right:1px solid #dfe5ec;font-size:12px;font-weight:600;color:#5f7080;position:sticky;left:0;z-index:5;background:#f8fafc;}
    .gantt-day-hdr{flex-shrink:0;width:36px;text-align:center;border-right:1px solid #eef3f6;padding:6px 0;}
    .gantt-day-hdr.week-col{width:100px;} /* 周视图列宽 */
    .gantt-day-hdr .hd{font-size:11px;color:#8fa3b0;font-weight:500;}
    .gantt-day-hdr .dn{font-size:13px;font-weight:600;color:#3d5266;margin-top:2px;}
    .gantt-day-hdr.today .hd{color:#00AAB7;}
    .gantt-day-hdr.today .dn{color:#00AAB7;}
    .gantt-day-hdr.weekend .dn{color:#b7791f;}
    .gantt-day-hdr.weekend .hd{color:#b7791f;}

    .gantt-row{display:flex;border-bottom:1px solid #eef3f6;min-height:56px;}
    .gantt-row:last-child{border-bottom:none;}
    .gantt-row:hover .gantt-name-cell{background:#f8fafc;}
    .gantt-name-cell{flex-shrink:0;width:130px;padding:12px 14px;border-right:1px solid #eef3f6;position:sticky;left:0;z-index:2;background:#fff;display:flex;flex-direction:column;justify-content:center;transition:background .12s;cursor:pointer;}
    .gn-name{font-size:13px;font-weight:600;color:#1d2733;}
    .gn-sub{font-size:11px;color:#8fa3b0;margin-top:2px;}
    .gantt-days-area{position:relative;display:flex;flex:1;}
    .gantt-day-col{flex-shrink:0;width:36px;height:100%;border-right:1px solid #eef3f6;}
    .gantt-day-col.week-col{width:100px;} /* 周视图列宽 */
    .gantt-day-col.today{background:#f0fbfc;}
    .gantt-day-col.weekend{background:#fafbfc;}
    .gantt-ev{position:absolute;height:44px;top:50%;transform:translateY(-50%);border-radius:6px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 9px;font-size:12px;font-weight:500;cursor:pointer;overflow:hidden;white-space:nowrap;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.06);line-height:1.3;}
    .gantt-ev .ev-dur{font-size:11px;font-weight:400;opacity:.8;}
    .gantt-ev:hover{filter:brightness(.96);z-index:2;}
    .gantt-ev.nj{background:#e8f7ef;color:#137d52;}
    .gantt-ev.sj{background:#edf1f5;color:#475569;}
    .gantt-ev.bj{background:#fff7e6;color:#b7791f;}
    .gantt-ev.hj{background:#fce7f3;color:#9d174d;}
    .gantt-ev.cj{background:#fce7f3;color:#9d174d;}
    .gantt-ev.hlj{background:#fce7f3;color:#9d174d;}
    .gantt-ev.yej{background:#fce7f3;color:#9d174d;}
    .gantt-ev.tqj{background:#e0f2fe;color:#0369a1;}
    .gantt-ev.hlplj{background:#fef3c7;color:#b45309;}
    .gantt-ev.sangj{background:#f1f5f9;color:#475569;}
    .gantt-ev.lyj{background:#dcfce7;color:#15803d;}
    .gantt-ev.gsj{background:#fff7e6;color:#b7791f;}
    .gantt-ev.rrj{background:#fce7f3;color:#9d174d;}
    .gantt-ev.sb{background:#fff7ed;color:#c2410c;}
    .gantt-ev.bx{background:#ede9fe;color:#7c3aed;}

    /* ── 图例 + 弹框 ── */
    .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#5f7080;}
    .ld{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
    .modal-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:2000;align-items:center;justify-content:center;}
    .modal-mask.show{display:flex;}
    .modal-box{background:#fff;border-radius:12px;padding:24px 28px;width:400px;max-width:96vw;box-shadow:0 8px 32px rgba(0,0,0,.18);}
    .modal-box h3{font-size:15px;font-weight:600;color:#1d2733;margin-bottom:14px;}
    .dg{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;}
    .dg dt{color:#5f7080;} .dg dd{color:#1d2733;font-weight:500;margin:0;}
    .modal-footer{display:flex;justify-content:flex-end;margin-top:18px;}
    /* 员工信息卡 */
    .modal-emp{background:#e6f7f9;border:1px solid #b3e6ea;border-radius:8px;padding:11px 14px;margin-bottom:16px;font-size:13px;color:#5f7080;display:flex;gap:20px;flex-wrap:wrap;}
    .modal-emp strong{color:#1a2533;}
    /* 表单行 */
    .mrow{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;font-size:14px;color:#5f7080;}
    .mrow input,.mrow textarea{border:1px solid #dfe5ec;border-radius:6px;padding:8px 10px;font:inherit;box-sizing:border-box;width:100%;background:#f5f7fa;color:#64748b;}
    .mrow input{height:34px;}
    .mrow textarea{min-height:60px;resize:vertical;}
    .mrow-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
    /* 竖向审批流程节点 */
    .approval-flow-vertical{display:flex;flex-direction:column;gap:0;margin-top:8px;}
    .flow-node{display:flex;align-items:flex-start;gap:12px;position:relative;padding-bottom:16px;}
    .flow-node:last-child{padding-bottom:0;}
    .flow-node::before{content:'';position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#dfe5ec;}
    .flow-node:last-child::before{display:none;}
    .flow-node-icon{width:24px;height:24px;border-radius:50%;background:#f5f7fa;border:2px solid #dfe5ec;display:flex;align-items:center;justify-content:center;font-size:12px;color:#8fa3b0;flex-shrink:0;z-index:1;}
    .flow-node.done .flow-node-icon{background:#e8f7ef;border-color:#16a36a;color:#16a36a;}
    .flow-node.cc .flow-node-icon{background:#fff9e8;border-color:#f4d898;color:#b7791f;}
    .flow-node-content{flex:1;}
    .flow-node-title{font-size:14px;font-weight:500;color:#1d2733;margin-bottom:4px;}
    .flow-node-hint{font-size:12px;color:#8fa3b0;margin-top:2px;}
    /* 证明材料提示 */
    .material-hint{background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:10px 12px;font-size:13px;color:#c2410c;}
    .material-hint .hint-list{margin:0;padding-left:18px;}
    .material-hint .hint-list li{margin-bottom:2px;}
    /* 附件列表 */
    .file-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
    .file-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8fafc;border:1px solid #eef3f6;border-radius:6px;font-size:13px;}
    .file-item .file-icon{font-size:16px;color:#5f7080;}
    .file-item .file-name{flex:1;color:#1d2733;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .file-item .file-size{color:#8fa3b0;font-size:12px;}
  </style>
</head>

      </div>
      <div class="field">
        <span>部门</span>
        <select id="deptFilter" onchange="renderAll()">
          <option value="">全部部门</option>

          <option>生产指挥中心</option>
        </select>
      </div>
      <div class="field">
        <span>姓名/编号</span>
        <input id="searchInput" placeholder="请输入" oninput="renderAll()"
          style="width:120px;height:34px;border:1px solid #dfe5ec;border-radius:6px;padding:0 10px;font:inherit;font-size:13px;">
      </div>
      <button class="btn" onclick="resetFilters()">重置</button>

    <!-- 图例 -->
    <div class="legend" style="margin-left:auto;">
      <div class="legend-item"><div class="ld" style="background:#e8f7ef;border:1px solid #b7e4cb;"></div>年假</div>
      <div class="legend-item"><div class="ld" style="background:#edf1f5;border:1px solid #cbd5e1;"></div>事假</div>
      <div class="legend-item"><div class="ld" style="background:#fff7e6;border:1px solid #f0d9a8;"></div>病假/工伤假</div>
      <div class="legend-item"><div class="ld" style="background:#fce7f3;border:1px solid #f0b3d5;"></div>婚假/产假/护理假/丧假/哺乳假等</div>
      <div class="legend-item"><div class="ld" style="background:#fff7ed;border:1px solid #fed7aa;"></div>加班</div>
      <div class="legend-item"><div class="ld" style="background:#ede9fe;border:1px solid #c4b5fd;"></div>补休假</div>
    </div>
  </div>

  <!-- 月视图：Gantt -->
  <div id="monthView">
    <div class="gantt-outer"><div id="ganttInner"></div></div>
  </div>

  <!-- 周视图：Gantt（7天） -->
  <div id="weekView" style="display:none;">
    <div class="gantt-outer"><div id="weekGanttInner"></div></div>
  </div>

  <!-- 弹框 -->

        <div id="detailApprovalFlow" class="approval-flow-vertical"></div>
      </div>
      <div class="modal-footer"><button class="btn" onclick="closeModal('detailModal')">关闭</button></div>
    </div>
  </div>
</main>

<script>
// 假期证明材料/计假方式配置已抽取到共享配置文件 ../shared/leave-config.js
// （leaveMaterials, leaveCalcNatural, getCalcMethodText 等），与 leave-apply.html、
// approval-center.html 共用同一数据源，修改假期规则只需改那一处文件。

// 补休假时长统一按"天(小时)"格式展示，与请假申请页"0.5天起请"的规则保持一致
// （补休假申请环节最小单位为半天=4小时，8小时工作制下 天数 = 小时数 ÷ 8）
function formatCompLeaveDuration(hours) {
  var days = hours / 8;
  var daysText = (days % 1 === 0) ? days : days.toFixed(1);
  return daysText + '天(' + hours + 'h)';
}

// 根据文件名获取图标
function getFileIcon(filename) {
  var ext = filename.split('.').pop().toLowerCase();
  switch(ext){
    case 'pdf': return '📄';
    case 'doc':
    case 'docx': return '📝';
    case 'jpg':
    case 'jpeg':
    case 'png': return '🖼️';
    default: return '📎';
  }
}

var curView='month', curDate=new Date(2026,5,1), curWeekIdx=0;
function pad(n){return n<10?'0'+n:''+n;}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var DS=['一','二','三','四','五','六','日'];

function getWeeksInMonth(year, month) {
  var weeks = [];
  var firstDay = new Date(year, month, 1);
  var lastDay = new Date(year, month + 1, 0);
  var d = new Date(firstDay);
  var dow = d.getDay();
  d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
  var weekNum = 1;
  while (d <= lastDay || weekNum === 1) {
    var mon = new Date(d);
    var sun = new Date(d);
    sun.setDate(sun.getDate() + 6);
    if (sun >= firstDay && mon <= lastDay) {
      weeks.push({ mon: new Date(mon), sun: new Date(sun), label: '第' + weekNum + '周 (' + (mon.getMonth()+1) + '/' + mon.getDate() + ' - ' + (sun.getMonth()+1) + '/' + sun.getDate() + ')' });
      weekNum++;
    }
    d.setDate(d.getDate() + 7);
    if (weekNum > 6) break;
  }
  return weeks;
}

function onYMChange(){
  var y=parseInt(document.getElementById('yearSel').value);
  var m=parseInt(document.getElementById('monthSel').value);
  curDate=new Date(y,m,1);
  curWeekIdx = 0;
  updateWeekSelector();
  renderAll();
}

function onWeekChange(){
  curWeekIdx = parseInt(document.getElementById('weekSel').value);
  renderAll();
}

function updateWeekSelector(){
  var y=curDate.getFullYear(), m=curDate.getMonth();
  var weeks = getWeeksInMonth(y, m);
  var sel = document.getElementById('weekSel');
  sel.innerHTML = '';
  weeks.forEach(function(w, i){
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = w.label;
    if(i === curWeekIdx) opt.selected = true;
    sel.appendChild(opt);
  });
  if(curWeekIdx >= weeks.length) curWeekIdx = 0;
}

function resetFilters(){
  document.getElementById('typeFilter').value='';
  document.getElementById('deptFilter').value='';
  document.getElementById('searchInput').value='';
  renderAll();
}
function filteredEmps(){
  var dept=((document.getElementById('deptFilter')||{}).value)||'';
  var kw=((document.getElementById('searchInput')||{}).value||'').trim();
  return EMPLOYEES.filter(function(e){
    var matchDept=!dept||e.dept===dept;
    var matchKw=!kw||e.name.indexOf(kw)>=0||e.no.indexOf(kw)>=0;
    return matchDept&&matchKw;
  });
}

  var y=curDate.getFullYear(), m=curDate.getMonth();
  var ys=document.getElementById('yearSel'); if(ys) ys.value=String(y);
  var ms=document.getElementById('monthSel'); if(ms) ms.value=String(m);
  var dim=new Date(y,m+1,0).getDate();
  var todayStr=ds(new Date());
  var emps=filteredEmps();
  var typeFilter=(document.getElementById('typeFilter')||{value:''}).value;

  var hrow='<div class="gantt-hrow"><div class="gantt-name-hdr">姓名</div>';
  for(var d=1;d<=dim;d++){
    var dStr=y+'-'+pad(m+1)+'-'+pad(d);
    var dow=new Date(y,m,d).getDay();
    var isW=(dow===0||dow===6), isT=(dStr===todayStr);
    var cls='gantt-day-hdr'+(isW?' weekend':'')+(isT?' today':'');
    var dowLabel=DS[dow===0?6:dow-1];
    hrow+='<div class="'+cls+'"><div class="hd">'+dowLabel+'</div><div class="dn">'+(isT?'今':d)+'</div></div>';
  }
  hrow+='</div>';

  var rows='';
  emps.forEach(function(emp){
    rows+='<div class="gantt-row"><div class="gantt-name-cell"><div class="gn-name">'+emp.name+'</div><div class="gn-sub">'+emp.no+'</div></div>';
    rows+='<div class="gantt-days-area">';
    for(var d=1;d<=dim;d++){
      var dStr=y+'-'+pad(m+1)+'-'+pad(d);
      var dow=new Date(y,m,d).getDay(), isW=(dow===0||dow===6), isT=(dStr===todayStr);
      rows+='<div class="gantt-day-col'+(isT?' today':'')+(isW&&!isT?' weekend':'')+'"></div>';
    }
    emp.events.forEach(function(ev,idx){
      if(ev.status !== '已批准') return; // 只显示已批准的记录
      if(typeFilter && ev.type!==typeFilter) return;
      var s=new Date(Math.max(new Date(ev.from),new Date(y,m,1)));
      var e=new Date(Math.min(new Date(ev.to),new Date(y,m+1,0)));
      if(s>e) return;
      var startDay=s.getDate(), endDay=e.getDate();
      var left=(startDay-1)*COL_W+2;
      var width=(endDay-startDay+1)*COL_W-4;
      var durationText = ev.type === 'bx' ? formatCompLeaveDuration(ev.hours) : (ev.days ? ev.days+'天' : (ev.hours ? ev.hours+'h' : ''));
      var displayHtml = ev.label + (durationText ? '<span class="ev-dur">'+durationText+'</span>' : '');
      rows+='<div class="gantt-ev '+ev.type+'" style="left:'+left+'px;width:'+width+'px;" onclick="showDetail('+emp.id+','+idx+')">'+displayHtml+'</div>';
    });
    rows+='</div></div>';
  });

  if(!emps.length) rows='<div style="padding:24px;text-align:center;color:#8fa3b0;font-size:13px;">无匹配人员</div>';
  gi.innerHTML=hrow+rows;
}

// ── Gantt 周视图（7天，全员） ──────────────────────────────────────
function buildWeek(){
  var gi=document.getElementById('weekGanttInner'); if(!gi) return;
  var y=curDate.getFullYear(), m=curDate.getMonth();
  var weeks = getWeeksInMonth(y, m);
  if(curWeekIdx >= weeks.length) curWeekIdx = 0;
  var weekData = weeks[curWeekIdx];
  if(!weekData) return;
  
  var mon = weekData.mon;
  var today=ds(new Date());
  var emps=filteredEmps();
  var typeFilter=(document.getElementById('typeFilter')||{value:''}).value;

  var hrow='<div class="gantt-hrow"><div class="gantt-name-hdr">姓名</div>';
  for(var i=0;i<7;i++){
    var d=new Date(mon); d.setDate(d.getDate()+i);
    var dStr=ds(d),dow=d.getDay(),isW=(dow===0||dow===6),isT=(dStr===today);
    var cls='gantt-day-hdr week-col'+(isW?' weekend':'')+(isT?' today':'');
    var dowLabel=DS[i];
    hrow+='<div class="'+cls+'"><div class="hd">'+dowLabel+'</div><div class="dn">'+(isT?'今':d.getDate())+'</div></div>';
  }
  hrow+='</div>';

  var rows='';
  emps.forEach(function(emp){
    rows+='<div class="gantt-row"><div class="gantt-name-cell"><div class="gn-name">'+emp.name+'</div><div class="gn-sub">'+emp.no+'</div></div>';
    rows+='<div class="gantt-days-area">';
    for(var i=0;i<7;i++){
      var d=new Date(mon); d.setDate(d.getDate()+i);
      var dStr=ds(d),dow=d.getDay(),isW=(dow===0||dow===6),isT=(dStr===today);
      rows+='<div class="gantt-day-col week-col'+(isT?' today':'')+(isW&&!isT?' weekend':'')+'"></div>';
    }
    emp.events.forEach(function(ev,idx){
      if(ev.status !== '已批准') return; // 只显示已批准的记录
      if(typeFilter && ev.type!==typeFilter) return;
      var evStart=new Date(ev.from), evEnd=new Date(ev.to);
      var weekStart=new Date(mon), weekEnd=new Date(mon); weekEnd.setDate(weekEnd.getDate()+6);
      if(evEnd<weekStart || evStart>weekEnd) return;
      var s=new Date(Math.max(evStart,weekStart));
      var e=new Date(Math.min(evEnd,weekEnd));
      var startIdx=Math.round((s-weekStart)/(1000*60*60*24));
      var endIdx=Math.round((e-weekStart)/(1000*60*60*24));
      var left=startIdx*WEEK_COL_W+2;
      var width=(endIdx-startIdx+1)*WEEK_COL_W-4;
      var durationText = ev.type === 'bx' ? formatCompLeaveDuration(ev.hours) : (ev.days ? ev.days+'天' : (ev.hours ? ev.hours+'h' : ''));
      var displayHtml = ev.label + (durationText ? '<span class="ev-dur">'+durationText+'</span>' : '');
      rows+='<div class="gantt-ev '+ev.type+'" style="left:'+left+'px;width:'+width+'px;" onclick="showDetail('+emp.id+','+idx+')">'+displayHtml+'</div>';
    });
    rows+='</div></div>';
  });

  if(!emps.length) rows='<div style="padding:24px;text-align:center;color:#8fa3b0;font-size:13px;">无匹配人员</div>';
  gi.innerHTML=hrow+rows;
}

function switchView(v){
  curView=v;
  document.getElementById('btnMonth').classList.toggle('active',v==='month');
  document.getElementById('btnWeek').classList.toggle('active',v==='week');
  document.getElementById('monthView').style.display=v==='month'?'':'none';
  document.getElementById('weekView').style.display=v==='week'?'':'none';
  document.getElementById('weekSelWrap').style.display=v==='week'?'':'none';
  if(v==='week') updateWeekSelector();
  renderAll();
}

function renderAll(){ curView==='month'?buildGantt():buildWeek(); }

function showDetail(empId,idx){
  var emp=EMPLOYEES.find(function(e){return e.id===empId;});
  var ev=emp&&emp.events[idx];if(!ev)return;
  
  // 弹框标题
  var isLeave = (ev.type !== 'sb');
  document.getElementById('detailTitle').textContent = emp.name + '的' + (isLeave ? '请假' : '加班') + '申请详情';
  
  // 员工信息卡
  document.getElementById('detailEmp').innerHTML = 
    '<span>姓名：<strong>' + emp.name + '</strong></span>' +
    '<span>单位/部门：<strong>' + emp.dept + '</strong></span>' +
    '<span>岗位：<strong>' + emp.post + '</strong></span>' +
    '<span>参加工作时间：<strong>' + (emp.workDate || '—') + '</strong></span>';
  
  // 表单字段（根据类型区分）
  var fieldsHtml = '';
  if(isLeave) {
    // 请假/补休类
    var typeLabel = ev.label + (ev.subType ? '（' + ev.subType + '）' : '');
    fieldsHtml = '<div class="mrow"><span>休假类别</span><input value="' + typeLabel + '" disabled></div>';

    // 子类型补充说明（病假子类型/探亲假子类型/护理照料假子类型等，来自 ev.subType）
    if(ev.subTypeHint) {
      fieldsHtml += '<div class="mrow"><span>子类型说明</span><input value="' + ev.subTypeHint + '" disabled></div>';
    }

    // 产假勾选累加详情（来自 ev.maternityDetail，格式如"难产+15天、纯母乳喂养+30天"）
    if(ev.maternityDetail) {
      fieldsHtml += '<div class="mrow"><span>产假天数构成</span><input value="' + ev.maternityDetail + '" disabled></div>';
    }

    // 婚假/丧假勾选累加详情（来自 ev.packageDetail）
    if(ev.packageDetail) {
      fieldsHtml += '<div class="mrow"><span>天数构成</span><input value="' + ev.packageDetail + '" disabled></div>';
    }

    // 工伤住院治疗天数（来自 ev.hospitalDays，工伤假专属可选字段）
    if(ev.hospitalDays) {
      fieldsHtml += '<div class="mrow"><span>工伤住院治疗天数</span><input value="' + ev.hospitalDays + '天" disabled></div>';
    }

    // 证明材料（有材料时显示）
    var materials = leaveMaterials[ev.label];
    if(materials && materials.length > 0) {
      fieldsHtml += '<div class="mrow"><span>所需证明材料</span><div class="material-hint"><ul class="hint-list" style="margin:0;">';
      materials.forEach(function(m) { fieldsHtml += '<li>' + m + '</li>'; });
      fieldsHtml += '</ul></div></div>';
    }
    
    // 计假方式
    fieldsHtml += '<div class="mrow"><span>计假方式</span><input value="' + getCalcMethodText(ev.label) + '" disabled></div>';
    
    // 附件（有附件时显示）
    if(ev.attachments && ev.attachments.length > 0) {
      fieldsHtml += '<div class="mrow"><span>附件</span><div class="file-list">';
      ev.attachments.forEach(function(f) {
        fieldsHtml += '<div class="file-item"><span class="file-icon">' + getFileIcon(f.name) + '</span>';
        fieldsHtml += '<span class="file-name" title="' + f.name + '">' + f.name + '</span>';
        fieldsHtml += '<span class="file-size">' + f.size + '</span></div>';
      });
      fieldsHtml += '</div></div>';
    }
    
    var startLabel = ev.from + (ev.fromPeriod ? '（' + (ev.fromPeriod === 'am' ? '上午' : '下午') + '）' : '');
    var endLabel = ev.to + (ev.toPeriod ? '（' + (ev.toPeriod === 'am' ? '上午' : '下午') + '）' : '');
    fieldsHtml += '<div class="mrow-2col"><div class="mrow" style="margin:0;"><span>开始时间</span><input value="' + startLabel + '" disabled></div>';
    fieldsHtml += '<div class="mrow" style="margin:0;"><span>结束时间</span><input value="' + endLabel + '" disabled></div></div>';
    if(ev.days) fieldsHtml += '<div class="mrow"><span>时长</span><input value="' + ev.days + '天" disabled></div>';
    if(ev.hours) fieldsHtml += '<div class="mrow"><span>时长</span><input value="' + (ev.type === 'bx' ? formatCompLeaveDuration(ev.hours) : ev.hours + '小时') + '" disabled></div>';
    fieldsHtml += '<div class="mrow"><span>休假事由</span><textarea disabled>' + (ev.reason || '') + '</textarea></div>';
    if(ev.remark) fieldsHtml += '<div class="mrow"><span>备注</span><textarea disabled style="min-height:40px;">' + ev.remark + '</textarea></div>';
  } else {
    // 加班类
    fieldsHtml = '<div class="mrow-2col"><div class="mrow" style="margin:0;"><span>开始时间</span><input value="' + ev.from + '" disabled></div>';
    fieldsHtml += '<div class="mrow" style="margin:0;"><span>结束时间</span><input value="' + ev.to + '" disabled></div></div>';
    fieldsHtml += '<div class="mrow"><span>时长</span><input value="' + ev.hours + '小时" disabled></div>';
    fieldsHtml += '<div class="mrow"><span>加班事由</span><textarea disabled>' + (ev.reason || '') + '</textarea></div>';
  }
  document.getElementById('detailFields').innerHTML = fieldsHtml;
  
  // 审批流程
  var flowHtml = '';
  if(ev.approvals && ev.approvals.length) {
    var icons = ['1', '2', '抄'];
    ev.approvals.forEach(function(a, i){
      var nodeClass = 'flow-node done';
      var iconNum = i < 3 ? icons[i] : (i + 1);
      if(a.step === '人力资源部抄送'){
        nodeClass = 'flow-node cc done';
        iconNum = '抄';
      }
      var resultText = '<span style="color:#15803d;">✓ ' + a.result + (a.time ? ' · ' + a.time : '') + '</span>';
      flowHtml += '<div class="' + nodeClass + '">';
      flowHtml += '<div class="flow-node-icon">' + iconNum + '</div>';
      flowHtml += '<div class="flow-node-content">';
      flowHtml += '<div class="flow-node-title">' + a.step + '</div>';
      flowHtml += '<div class="flow-node-hint" style="color:#1d2733;font-weight:500;">' + a.approver + '</div>';
      flowHtml += '<div class="flow-node-hint">' + resultText + '</div>';
      flowHtml += '</div></div>';
    });
    document.getElementById('detailApprovalWrap').style.display = '';
  } else {
    document.getElementById('detailApprovalWrap').style.display = 'none';
  }
  document.getElementById('detailApprovalFlow').innerHTML = flowHtml;
  
  document.getElementById('detailModal').classList.add('show');
}
function closeModal(id){document.getElementById(id).classList.remove('show');}
document.querySelectorAll('.modal-mask').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('show');});});

window.addEventListener('load', function(){
  // 读取 URL 参数，支持从员工档案页跳转时自动筛选
  var params = new URLSearchParams(window.location.search);
  var empParam = params.get('emp'); // 员工编号或姓名
  if(empParam) {
    document.getElementById('searchInput').value = empParam;
  }
  renderAll();
});

  alert('导出当前视图的考勤数据（原型演示）');
}
