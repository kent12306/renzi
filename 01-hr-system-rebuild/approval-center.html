<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>审批中心</title>
  <link rel="stylesheet" href="../shared/prototype.css">
  <style>
    /* 主Tab */
    .main-tabs { display:flex; border-bottom:2px solid #eef3f6; margin-bottom:16px; }
    .main-tab { padding:12px 24px; font-size:14px; color:#5f7080; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:color .15s,border-color .15s; display:flex; align-items:center; gap:8px; }
    .main-tab:hover { color:#00AAB7; }
    .main-tab.active { color:#00AAB7; font-weight:600; border-bottom-color:#00AAB7; }
    /* 申请类型标签 */
    .type-label { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:500; }
    .lbl-leave { background:#dcfce7; color:#15803d; }
    .lbl-ot { background:#fff7ed; color:#c2410c; }
    .lbl-ot-revoke { background:#fef3c7; color:#b45309; }
    /* 批量操作区（筛选行右侧） */
    .selected-count { font-size:13px; color:#5f7080; }
    .selected-count strong { color:#1d2733; }
    /* 表格内复选框 */
    .tbl-check { width:16px; height:16px; cursor:pointer; }
    /* 日期范围 */
    .date-range { display:flex; align-items:center; gap:6px; }
    .date-range input[type="date"] { width:130px; height:34px; border:1px solid #dfe5ec; border-radius:6px; padding:0 8px; font:inherit; font-size:13px; }
    /* 弹框遮罩 */
    .modal-mask { display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:2000; align-items:center; justify-content:center; }
    .modal-mask.show { display:flex; }
    .modal-box { background:#fff; border-radius:12px; padding:24px 28px; max-width:96vw; box-shadow:0 8px 32px rgba(0,0,0,.18); }
    .modal-box h3 { font-size:15px; font-weight:600; color:#1d2733; margin-bottom:14px; }
    .dg { display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:14px; }
    .dg dt { color:#5f7080; }
    .dg dd { color:#1d2733; font-weight:500; margin:0; }
    /* 员工信息卡 */
    .modal-emp { background:#e6f7f9; border:1px solid #b3e6ea; border-radius:8px; padding:11px 14px; margin-bottom:16px; font-size:13px; color:#5f7080; display:flex; gap:20px; flex-wrap:wrap; }
    .modal-emp strong { color:#1a2533; }
    /* 表单行 */
    .mrow { display:flex; flex-direction:column; gap:4px; margin-bottom:14px; font-size:14px; color:#5f7080; }
    .mrow input, .mrow textarea { border:1px solid #dfe5ec; border-radius:6px; padding:8px 10px; font:inherit; box-sizing:border-box; width:100%; background:#f5f7fa; color:#64748b; }
    .mrow input { height:34px; }
    .mrow textarea { min-height:60px; resize:vertical; }
    .mrow-2col { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
    /* 竖向审批流程节点 */
    .approval-flow-vertical { display:flex; flex-direction:column; gap:0; margin-top:8px; }
    .flow-node { display:flex; align-items:flex-start; gap:12px; position:relative; padding-bottom:16px; }
    .flow-node:last-child { padding-bottom:0; }
    .flow-node::before { content:''; position:absolute; left:11px; top:24px; bottom:0; width:2px; background:#dfe5ec; }
    .flow-node:last-child::before { display:none; }
    .flow-node-icon { width:24px; height:24px; border-radius:50%; background:#f5f7fa; border:2px solid #dfe5ec; display:flex; align-items:center; justify-content:center; font-size:12px; color:#8fa3b0; flex-shrink:0; z-index:1; }
    .flow-node.active .flow-node-icon { background:#e6f7f9; border-color:#00AAB7; color:#00AAB7; }
    .flow-node.done .flow-node-icon { background:#e8f7ef; border-color:#16a36a; color:#16a36a; }
    .flow-node.rejected .flow-node-icon { background:#fef2f2; border-color:#dc2626; color:#dc2626; }
    .flow-node.cc .flow-node-icon { background:#fff9e8; border-color:#f4d898; color:#b7791f; }
    .flow-node-content { flex:1; }
    .flow-node-title { font-size:14px; font-weight:500; color:#1d2733; margin-bottom:4px; }
    .flow-node-hint { font-size:12px; color:#8fa3b0; margin-top:2px; }
    /* 原审批折叠区 */
    .original-approval-collapse { margin:16px 0; border:1px solid #e0e8ec; border-radius:8px; }
    .original-approval-collapse[open] { background:#f8fafc; }
    .collapse-header { display:flex; align-items:center; gap:8px; padding:12px 14px; cursor:pointer; font-size:14px; font-weight:500; color:#00AAB7; list-style:none; }
    .collapse-header::-webkit-details-marker { display:none; }
    .collapse-icon { font-size:10px; transition:transform .15s; }
    .original-approval-collapse[open] .collapse-icon { transform:rotate(90deg); }
    .collapse-content { padding:14px; border-top:1px solid #e0e8ec; background:#fff; border-radius:0 0 7px 7px; }
    .collapse-content .orig-row { display:grid; grid-template-columns:100px 1fr; gap:6px 12px; font-size:13px; margin-bottom:8px; }
    .collapse-content .orig-row dt { color:#8fa3b0; }
    .collapse-content .orig-row dd { color:#1d2733; margin:0; }
    /* 证明材料提示 */
    .material-hint { background:#fff7ed; border:1px solid #fed7aa; border-radius:6px; padding:10px 12px; font-size:13px; color:#c2410c; }
    .material-hint .hint-title { font-weight:600; margin-bottom:4px; }
    .material-hint .hint-list { margin:0; padding-left:18px; }
    .material-hint .hint-list li { margin-bottom:2px; }
    /* 附件列表 */
    .file-list { display:flex; flex-direction:column; gap:6px; margin-top:4px; }
    .file-item { display:flex; align-items:center; gap:8px; padding:8px 10px; background:#f8fafc; border:1px solid #eef3f6; border-radius:6px; font-size:13px; }
    .file-item .file-icon { font-size:16px; color:#5f7080; }
    .file-item .file-name { flex:1; color:#1d2733; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .file-item .file-size { color:#8fa3b0; font-size:12px; }
  </style>
</head>
<body data-module="attendance">
<main class="page-content" data-title="审批中心" data-desc="管理请假、加班、补休申请的审批流程，支持待处理、已处理、抄送查看。">

  <!-- 主Tab导航 -->
  <div class="main-tabs">
    <div class="main-tab active" onclick="switchMainTab('pending')">待处理</div>
    <div class="main-tab" onclick="switchMainTab('processed')">已处理</div>
    <div class="main-tab" onclick="switchMainTab('cc')">抄送我</div>
  </div>

  <!-- ========== 待处理 Tab ========== -->
  <div id="tabPending" class="tab-content">
    <section class="filter-bar" style="flex-wrap:wrap;">
      <label class="field">申请类型：
        <select id="pendingType" onchange="filterPending()">
          <option value="">全部</option>
          <option value="leave">请假</option>
          <option value="ot">加班</option>
          <option value="ot-revoke">加班(撤销)</option>
        </select>
      </label>
      <label class="field">申请人：<input id="pendingApplicant" placeholder="请输入" oninput="filterPending()"></label>
      <label class="field">申请时间：
        <span class="date-range">
          <input type="date" id="pendingDateFrom" onchange="filterPending()">
          <span>至</span>
          <input type="date" id="pendingDateTo" onchange="filterPending()">
        </span>
      </label>
      <button class="btn primary" onclick="filterPending()">查询</button>
      <button class="btn" onclick="resetPendingFilters()">重置</button>
      <!-- 批量操作区（右侧） -->
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
        <input type="checkbox" class="tbl-check" id="checkAllPending" onclick="toggleAllPending()">
        <span class="selected-count">已选 <strong id="pendingSelectedCount">0</strong> 项</span>
        <button class="btn primary" onclick="batchApprove()">批量同意</button>
        <button class="btn" onclick="batchReject()">批量拒绝</button>
      </div>
    </section>

    <section class="card table-card">
      <table>
        <thead>
          <tr>
            <th style="width:40px;"></th>
            <th class="col-seq">序号</th>
            <th>申请类型</th>
            <th>申请人</th>
            <th>部门</th>
            <th>申请时间</th>
            <th>开始时间</th>
            <th>结束时间</th>
            <th>时长</th>
            <th>事由</th>
            <th class="col-action">操作</th>
          </tr>
        </thead>
        <tbody id="pendingTbody"></tbody>
      </table>
    </section>
  </div>

  <!-- ========== 已处理 Tab ========== -->
  <div id="tabProcessed" class="tab-content" style="display:none;">
    <section class="filter-bar">
      <label class="field">审批状态：
        <select id="processedStatus" onchange="filterProcessed()">
          <option value="">全部</option>
          <option value="pending">审批中</option>
          <option value="approved">已批准</option>
          <option value="rejected">已驳回</option>
          <option value="cancelled">已撤销</option>
          <option value="revoking">撤销审批中</option>
          <option value="revoked">批准后撤销</option>
        </select>
      </label>
      <label class="field">申请类型：
        <select id="processedType" onchange="filterProcessed()">
          <option value="">全部</option>
          <option value="leave">请假</option>
          <option value="ot">加班</option>
          <option value="ot-revoke">加班(撤销)</option>
        </select>
      </label>
      <label class="field">申请人：<input id="processedApplicant" placeholder="请输入" oninput="filterProcessed()"></label>
      <label class="field">处理时间：
        <span class="date-range">
          <input type="date" id="processedDateFrom" onchange="filterProcessed()">
          <span>至</span>
          <input type="date" id="processedDateTo" onchange="filterProcessed()">
        </span>
      </label>
      <button class="btn primary" onclick="filterProcessed()">查询</button>
      <button class="btn" onclick="resetProcessedFilters()">重置</button>
    </section>

    <section class="card table-card">
      <table>
        <thead>
          <tr>
            <th class="col-seq">序号</th>
            <th>申请类型</th>
            <th>申请人</th>
            <th>部门</th>
            <th>申请时间</th>
            <th>开始时间</th>
            <th>结束时间</th>
            <th>时长</th>
            <th>审批状态</th>
            <th>处理时间</th>
            <th class="col-action">操作</th>
          </tr>
        </thead>
        <tbody id="processedTbody"></tbody>
      </table>
    </section>
  </div>

  <!-- ========== 抄送我 Tab ========== -->
  <div id="tabCC" class="tab-content" style="display:none;">
    <section class="filter-bar">
      <label class="field">审批状态：
        <select id="ccStatus" onchange="filterCC()">
          <option value="">全部</option>
          <option value="pending">审批中</option>
          <option value="approved">已批准</option>
          <option value="rejected">已驳回</option>
          <option value="cancelled">已撤销</option>
          <option value="revoking">撤销审批中</option>
          <option value="revoked">批准后撤销</option>
        </select>
      </label>
      <label class="field">申请类型：
        <select id="ccType" onchange="filterCC()">
          <option value="">全部</option>
          <option value="leave">请假</option>
          <option value="ot">加班</option>
          <option value="ot-revoke">加班(撤销)</option>
        </select>
      </label>
      <label class="field">申请人：<input id="ccApplicant" placeholder="请输入" oninput="filterCC()"></label>
      <label class="field">抄送日期：
        <span class="date-range">
          <input type="date" id="ccDateFrom" onchange="filterCC()">
          <span>至</span>
          <input type="date" id="ccDateTo" onchange="filterCC()">
        </span>
      </label>
      <button class="btn primary" onclick="filterCC()">查询</button>
      <button class="btn" onclick="resetCCFilters()">重置</button>
    </section>

    <section class="card table-card">
      <table>
        <thead>
          <tr>
            <th class="col-seq">序号</th>
            <th>申请类型</th>
            <th>申请人</th>
            <th>部门</th>
            <th>申请时间</th>
            <th>开始时间</th>
            <th>结束时间</th>
            <th>时长</th>
            <th>审批状态</th>
            <th>抄送日期</th>
            <th class="col-action">操作</th>
          </tr>
        </thead>
        <tbody id="ccTbody"></tbody>
      </table>
    </section>
  </div>

  <!-- 审批弹框（请假/加班） -->
  <div class="modal-mask" id="approvalModal">
    <div class="modal-box" style="width:640px;">
      <h3 id="approvalTitle">审批申请</h3>
      <div class="modal-emp" id="approvalEmp"></div>
      <div id="approvalFields"></div>
      <div class="mrow">
        <span>审批流程</span>
        <div id="approvalFlow" class="approval-flow-vertical"></div>
      </div>
      <div class="mrow" style="margin-top:16px;">
        <span>审批意见</span>
        <textarea id="approvalComment" rows="3" placeholder="请输入审批意见（可选）"></textarea>
      </div>
      <div class="modal-footer" style="margin-top:18px;display:flex;justify-content:flex-end;gap:10px;">
        <button class="btn" onclick="closeModal('approvalModal')">取消</button>
        <button class="btn" onclick="doReject()">驳回</button>
        <button class="btn primary" onclick="doApprove()">通过</button>
      </div>
    </div>
  </div>

  <!-- 查看详情弹框 -->
  <div class="modal-mask" id="detailModal">
    <div class="modal-box" style="width:640px;">
      <h3 id="detailTitle">申请详情</h3>
      <div class="modal-emp" id="detailEmp"></div>
      <div id="detailFields"></div>
      <div class="mrow">
        <span>审批流程</span>
        <div id="detailApprovalFlow" class="approval-flow-vertical"></div>
      </div>
      <div class="modal-footer" style="margin-top:18px;display:flex;justify-content:flex-end;">
        <button class="btn" onclick="closeModal('detailModal')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 批量审批确认弹框 -->
  <div class="modal-mask" id="batchModal">
    <div class="modal-box" style="width:420px;">
      <h3 id="batchTitle">批量审批确认</h3>
      <p id="batchMsg" style="font-size:14px;color:#3d5266;margin:16px 0;"></p>
      <div class="form-group">
        <label style="font-size:13px;color:#5f7080;margin-bottom:6px;display:block;">审批意见</label>
        <textarea id="batchComment" rows="2" placeholder="请输入审批意见（可选）" style="width:100%;border:1px solid #dfe5ec;border-radius:6px;padding:10px;font:inherit;font-size:13px;resize:vertical;"></textarea>
      </div>
      <div class="modal-footer" style="margin-top:18px;display:flex;justify-content:flex-end;gap:10px;">
        <button class="btn" onclick="closeModal('batchModal')">取消</button>
        <button class="btn primary" id="batchConfirmBtn" onclick="doBatchConfirm()">确认</button>
      </div>
    </div>
  </div>

  <!-- 加班撤销审批弹框（内嵌原审批信息折叠区） -->
  <div class="modal-mask" id="revokeApprovalModal">
    <div class="modal-box" style="width:600px;">
      <h3 id="revokeApprovalTitle">审批加班撤销申请</h3>
      <div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:10px 12px;font-size:13px;color:#c2410c;margin-bottom:14px;">该员工申请撤销已批准的加班记录，请审批。</div>
      <div class="modal-emp" id="revokeEmp"></div>
      <div id="revokeFields"></div>
      
      <!-- 原审批信息折叠区 -->
      <details class="original-approval-collapse" id="originalApprovalCollapse">
        <summary class="collapse-header">
          <span class="collapse-icon">▶</span>
          <span>查看原审批信息</span>
        </summary>
        <div class="collapse-content" id="originalApprovalContent">
          <!-- 由JS动态填充 -->
        </div>
      </details>
      
      <div class="mrow">
        <span>审批流程</span>
        <div id="revokeApprovalFlow" class="approval-flow-vertical"></div>
      </div>
      <div class="mrow" style="margin-top:16px;">
        <span>审批意见</span>
        <textarea id="revokeApprovalComment" rows="3" placeholder="请输入审批意见（可选）"></textarea>
      </div>
      <div class="modal-footer" style="margin-top:18px;display:flex;justify-content:flex-end;gap:10px;">
        <button class="btn" onclick="closeModal('revokeApprovalModal')">取消</button>
        <button class="btn" onclick="doRejectRevoke()">拒绝撤销</button>
        <button class="btn primary" onclick="doApproveRevoke()">同意撤销</button>
      </div>
    </div>
  </div>

  <!-- 查看原审批弹框（保留，用于已处理/抄送Tab的撤销审批中记录） -->
  <div class="modal-mask" id="originalApprovalModal">
    <div class="modal-box" style="width:560px;">
      <h3 id="originalApprovalTitle">原加班审批详情</h3>
      <div style="background:#e8f7ef;border:1px solid #a7f3d0;border-radius:6px;padding:10px 12px;font-size:13px;color:#15803d;margin-bottom:14px;">以下为该员工原已批准的加班申请信息。</div>
      <div class="modal-emp" id="originalApprovalEmp"></div>
      <div id="originalApprovalFields"></div>
      <div class="mrow">
        <span>原审批流程</span>
        <div id="originalApprovalFlow" class="approval-flow-vertical"></div>
      </div>
      <div class="modal-footer" style="margin-top:18px;display:flex;justify-content:flex-end;">
        <button class="btn" onclick="closeModal('originalApprovalModal')">关闭</button>
      </div>
    </div>
  </div>
</main>

// Tab 切换
function switchMainTab(tab) {
  document.querySelectorAll('.main-tab').forEach(function(t, i) {
    t.classList.toggle('active', (i===0&&tab==='pending')||(i===1&&tab==='processed')||(i===2&&tab==='cc'));
  });
  document.getElementById('tabPending').style.display = tab==='pending' ? '' : 'none';
  document.getElementById('tabProcessed').style.display = tab==='processed' ? '' : 'none';
  document.getElementById('tabCC').style.display = tab==='cc' ? '' : 'none';
}

// 类型标签HTML
function typeHtml(type) {
  if(type==='leave') return '<span class="type-label lbl-leave">请假</span>';
  if(type==='ot') return '<span class="type-label lbl-ot">加班</span>';
  if(type==='ot-revoke') return '<span class="type-label lbl-ot-revoke">加班(撤销)</span>';
  return '';
}

// 状态标签HTML
function statusHtml(status) {
  if(status==='approved') return '<span class="status green">已批准</span>';
  if(status==='rejected') return '<span class="status red">已驳回</span>';
  if(status==='pending') return '<span class="status amber">审批中</span>';
  if(status==='cancelled') return '<span class="status">已撤销</span>';
  if(status==='revoking') return '<span class="status amber">撤销审批中</span>';
  if(status==='revoked') return '<span class="status red">批准后撤销</span>';
  return '';
}

// 待处理：渲染
function renderPending(data) {
  var tbody = document.getElementById('pendingTbody');
  if(!data.length) {
    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:#8fa3b0;padding:32px;">暂无待处理申请</td></tr>';
    return;
  }
  var html = '';
  data.forEach(function(item, idx) {
    var duration = item.days || item.hours || '';
    var startTime = item.type === 'leave' ? item.startDate : item.startTime;
    var endTime = item.type === 'leave' ? item.endDate : item.endTime;
    var checked = pendingChecked.indexOf(item.id) >= 0 ? 'checked' : '';
    html += '<tr><td><input type="checkbox" class="tbl-check" data-id="'+item.id+'" '+checked+' onchange="onPendingCheck('+item.id+')"></td>';
    html += '<td class="col-seq">'+(idx+1)+'</td>';
    html += '<td>'+typeHtml(item.type)+'</td>';
    html += '<td>'+item.name+'</td>';
    html += '<td>'+item.dept+'</td>';
    html += '<td>'+item.applyTime+'</td>';
    html += '<td>'+startTime+'</td>';
    html += '<td>'+endTime+'</td>';
    html += '<td>'+duration+'</td>';
    html += '<td>'+(item.type === 'ot-revoke' ? item.revokeReason : item.reason)||'-'+'</td>';
    // 根据申请类型显示不同操作按钮
    if(item.type === 'ot-revoke') {
      // 加班撤销申请：审批（内含原审批折叠区）
      html += '<td class="col-action"><a class="btn link" href="javascript:void(0)" onclick="showRevokeApproval('+item.id+')">审批</a></td></tr>';
    } else {
      // 请假、加班申请
      html += '<td class="col-action"><a class="btn link" href="javascript:void(0)" onclick="showApproval('+item.id+')">审批</a></td></tr>';
    }
  });
  tbody.innerHTML = html;
  updatePendingCount();
}

// 待处理：筛选
function filterPending() {
  var type = document.getElementById('pendingType').value;
  var applicant = document.getElementById('pendingApplicant').value.trim().toLowerCase();
  var dateFrom = document.getElementById('pendingDateFrom').value;
  var dateTo = document.getElementById('pendingDateTo').value;
  var filtered = PENDING_DATA.filter(function(item) {
    // 筛选类型：leave=请假, ot=加班, ot-revoke=加班(撤销)
    if(type && item.type !== type) return false;
    if(applicant && item.name.toLowerCase().indexOf(applicant)<0 && item.no.toLowerCase().indexOf(applicant)<0) return false;
    if(dateFrom && item.applyTime.slice(0,10) < dateFrom) return false;
    if(dateTo && item.applyTime.slice(0,10) > dateTo) return false;
    return true;
  });
  renderPending(filtered);
}

function resetPendingFilters() {
  document.getElementById('pendingType').value = '';
  document.getElementById('pendingApplicant').value = '';
  document.getElementById('pendingDateFrom').value = '';
  document.getElementById('pendingDateTo').value = '';
  pendingChecked = [];
  filterPending();
}

// 待处理：复选框
function onPendingCheck(id) {
  var idx = pendingChecked.indexOf(id);
  if(idx >= 0) pendingChecked.splice(idx,1);
  else pendingChecked.push(id);
  updatePendingCount();
}

function toggleAllPending() {
  var checkAll = document.getElementById('checkAllPending').checked;
  var checkboxes = document.querySelectorAll('#pendingTbody .tbl-check');
  pendingChecked = [];
  checkboxes.forEach(function(cb) {
    cb.checked = checkAll;
    if(checkAll) pendingChecked.push(parseInt(cb.dataset.id));
  });
  updatePendingCount();
}

function updatePendingCount() {
  document.getElementById('pendingSelectedCount').textContent = pendingChecked.length;
  var checkAll = document.getElementById('checkAllPending');
  var total = document.querySelectorAll('#pendingTbody .tbl-check').length;
  checkAll.checked = total > 0 && pendingChecked.length === total;
}

// 批量操作
function batchApprove() {
  if(!pendingChecked.length) { alert('请先选择要审批的申请'); return; }
  batchAction = 'approve';
  document.getElementById('batchTitle').textContent = '批量同意确认';
  document.getElementById('batchMsg').textContent = '确认同意选中的 ' + pendingChecked.length + ' 项申请？';
  document.getElementById('batchConfirmBtn').textContent = '确认同意';
  document.getElementById('batchComment').value = '';
  document.getElementById('batchModal').classList.add('show');
}

function batchReject() {
  if(!pendingChecked.length) { alert('请先选择要审批的申请'); return; }
  batchAction = 'reject';
  document.getElementById('batchTitle').textContent = '批量拒绝确认';
  document.getElementById('batchMsg').textContent = '确认拒绝选中的 ' + pendingChecked.length + ' 项申请？';
  document.getElementById('batchConfirmBtn').textContent = '确认拒绝';
  document.getElementById('batchComment').value = '';
  document.getElementById('batchModal').classList.add('show');
}

function doBatchConfirm() {
  var action = batchAction === 'approve' ? '同意' : '拒绝';
  alert('已批量' + action + ' ' + pendingChecked.length + ' 项申请');
  pendingChecked = [];
  closeModal('batchModal');
  filterPending();
}

// 审批弹框
// 生成请假类申请的公共表单字段HTML（审批弹框/详情弹框共用），补充展示病假子类型、
// 产假勾选累加详情、婚假/丧假勾选累加详情、探亲假与护理照料假子类型、工伤住院天数、半天颗粒度
function buildLeaveFieldsHtml(item) {
  var fieldsHtml = '<div class="mrow"><span>休假类别</span><input value="' + (item.subType||'') + '" disabled></div>';

  // 子类型/勾选详情说明（病假子类型、探亲假子类型、护理照料假子类型、产假勾选累加、婚假/丧假勾选累加）
  if(item.subTypeDetail) {
    fieldsHtml += '<div class="mrow"><span>子类型/构成说明</span><input value="' + item.subTypeDetail + '" disabled></div>';
  }

  // 工伤住院治疗天数（工伤假专属可选字段）
  if(item.hospitalDays) {
    fieldsHtml += '<div class="mrow"><span>工伤住院治疗天数</span><input value="' + item.hospitalDays + '天" disabled></div>';
  }

  // 证明材料（有材料时显示）
  var materials = leaveMaterials[item.subType];
  if(materials && materials.length > 0) {
    fieldsHtml += '<div class="mrow"><span>所需证明材料</span><div class="material-hint"><ul class="hint-list" style="margin:0;">';
    materials.forEach(function(m) { fieldsHtml += '<li>' + m + '</li>'; });
    fieldsHtml += '</ul></div></div>';
  }

  // 计假方式
  fieldsHtml += '<div class="mrow"><span>计假方式</span><input value="' + getCalcMethodText(item.subType) + '" disabled></div>';

  // 附件（有附件时显示）
  if(item.attachments && item.attachments.length > 0) {
    fieldsHtml += '<div class="mrow"><span>附件</span><div class="file-list">';
    item.attachments.forEach(function(f) {
      fieldsHtml += '<div class="file-item"><span class="file-icon">' + getFileIcon(f.name) + '</span>';
      fieldsHtml += '<span class="file-name" title="' + f.name + '">' + f.name + '</span>';
      fieldsHtml += '<span class="file-size">' + f.size + '</span></div>';
    });
    fieldsHtml += '</div></div>';
  }

  // 开始/结束时间（半天颗粒度：有 startPeriod/endPeriod 时附加"上午/下午"标注）
  var startLabel = item.startDate + (item.startPeriod ? '（' + (item.startPeriod === 'am' ? '上午' : '下午') + '）' : '');
  var endLabel = item.endDate + (item.endPeriod ? '（' + (item.endPeriod === 'am' ? '上午' : '下午') + '）' : '');
  fieldsHtml += '<div class="mrow-2col"><div class="mrow" style="margin:0;"><span>开始时间</span><input value="' + startLabel + '" disabled></div>';
  fieldsHtml += '<div class="mrow" style="margin:0;"><span>结束时间</span><input value="' + endLabel + '" disabled></div></div>';
  fieldsHtml += '<div class="mrow"><span>时长</span><input value="' + item.days + '" disabled></div>';
  fieldsHtml += '<div class="mrow"><span>休假事由</span><textarea disabled style="min-height:60px;background:#f5f7fa;">' + (item.reason||'') + '</textarea></div>';
  fieldsHtml += '<div class="mrow"><span>备注</span><textarea disabled style="min-height:40px;background:#f5f7fa;">' + (item.remark||'无') + '</textarea></div>';
  return fieldsHtml;
}

function showApproval(id) {
  var item = PENDING_DATA.find(function(d) { return d.id === id; });
  if(!item) return;
  document.getElementById('approvalTitle').textContent = '审批 - ' + item.name + '的' + item.typeLabel + '申请';
  
  // 员工信息卡
  document.getElementById('approvalEmp').innerHTML = 
    '<span>姓名：<strong>' + item.name + '</strong></span>' +
    '<span>单位/部门：<strong>' + item.dept + '</strong></span>' +
    '<span>岗位：<strong>' + item.post + '</strong></span>' +
    '<span>参加工作时间：<strong>' + item.workDate + '</strong></span>';
  
  // 表单字段（根据类型区分）
  var fieldsHtml = '';
  if(item.type === 'leave') {
    fieldsHtml = buildLeaveFieldsHtml(item);
  } else {
    // 加班
    fieldsHtml = '<div class="mrow-2col"><div class="mrow" style="margin:0;"><span>开始时间</span><input value="' + item.startTime + '" disabled></div>';
    fieldsHtml += '<div class="mrow" style="margin:0;"><span>结束时间</span><input value="' + item.endTime + '" disabled></div></div>';
    fieldsHtml += '<div class="mrow"><span>时长</span><input value="' + item.hours + '" disabled></div>';
    fieldsHtml += '<div class="mrow"><span>加班事由</span><textarea disabled style="min-height:60px;background:#f5f7fa;">' + (item.reason||'') + '</textarea></div>';
  }
  document.getElementById('approvalFields').innerHTML = fieldsHtml;
  
  // 审批流程
  document.getElementById('approvalFlow').innerHTML = buildApprovalFlowHtml(item.approvals);
  
  document.getElementById('approvalComment').value = '';
  window._currentApprovalId = id;
  document.getElementById('approvalModal').classList.add('show');
}

    origHtml += '<div style="margin-top:12px;"><span style="font-size:13px;color:#5f7080;">原审批流程</span>';

  // 审批流程
  document.getElementById('revokeApprovalFlow').innerHTML = buildApprovalFlowHtml(item.approvals);
  
  document.getElementById('revokeApprovalComment').value = '';
  window._currentRevokeId = id;
  document.getElementById('revokeApprovalModal').classList.add('show');

// 查看详情弹框
function showDetail(source, id) {
  var data = source === 'processed' ? PROCESSED_DATA : CC_DATA;
  var item = data.find(function(d) { return d.id === id; });
  if(!item) return;
  document.getElementById('detailTitle').textContent = item.name + '的' + item.typeLabel + '申请详情';
  
  // 员工信息卡
  document.getElementById('detailEmp').innerHTML = 
    '<span>姓名：<strong>' + item.name + '</strong></span>' +
    '<span>单位/部门：<strong>' + item.dept + '</strong></span>' +
    '<span>岗位：<strong>' + item.post + '</strong></span>' +
    '<span>参加工作时间：<strong>' + item.workDate + '</strong></span>';
  
  // 表单字段（根据类型区分）
  var fieldsHtml = '';
  if(item.type === 'leave') {
    fieldsHtml = buildLeaveFieldsHtml(item);
  } else {
    // 加班
    fieldsHtml = '<div class="mrow-2col"><div class="mrow" style="margin:0;"><span>开始时间</span><input value="' + item.startTime + '" disabled></div>';
    fieldsHtml += '<div class="mrow" style="margin:0;"><span>结束时间</span><input value="' + item.endTime + '" disabled></div></div>';
    fieldsHtml += '<div class="mrow"><span>时长</span><input value="' + item.hours + '" disabled></div>';
    fieldsHtml += '<div class="mrow"><span>加班事由</span><textarea disabled style="min-height:60px;background:#f5f7fa;">' + (item.reason||'') + '</textarea></div>';
  }
  // 状态信息
  fieldsHtml += '<div class="mrow"><span>审批状态</span><input value="' + item.statusLabel + '" disabled></div>';
  if(source === 'processed') {
    fieldsHtml += '<div class="mrow"><span>处理时间</span><input value="' + item.processTime + '" disabled></div>';
  }
  if(source === 'cc') {
    fieldsHtml += '<div class="mrow"><span>抄送日期</span><input value="' + item.ccTime + '" disabled></div>';
  }
  if(item.rejectReason) {
    fieldsHtml += '<div class="mrow"><span>驳回原因</span><textarea disabled style="min-height:40px;background:#fef2f2;border-color:#fecaca;color:#dc2626;">' + item.rejectReason + '</textarea></div>';
  }
  document.getElementById('detailFields').innerHTML = fieldsHtml;
  
  // 审批流程
  document.getElementById('detailApprovalFlow').innerHTML = buildApprovalFlowHtml(item.approvals);
  
  document.getElementById('detailModal').classList.add('show');
}

// 生成审批流程HTML
function buildApprovalFlowHtml(approvals) {
  if(!approvals || !approvals.length) return '<div style="color:#8fa3b0;font-size:13px;">暂无审批流程</div>';
  var html = '';
  approvals.forEach(function(a) {
    var nodeClass = 'flow-node';
    var iconText = '○';
    if(a.result === '同意' || a.result === '已抄送' || a.result === '本人申请撤销') {
      nodeClass += ' done';
      iconText = '✓';
    } else if(a.result === '审批中') {
      nodeClass += ' active';
      iconText = '●';
    } else if(a.result === '驳回') {
      nodeClass += ' rejected';
      iconText = '✗';
    } else if(a.result === '待抄送' || a.result === '待审批') {
      nodeClass += ' cc';
      iconText = '○';
    }
    html += '<div class="' + nodeClass + '">';
    html += '<div class="flow-node-icon">' + iconText + '</div>';
    html += '<div class="flow-node-content">';
    html += '<div class="flow-node-title">' + a.step + '：' + a.approver + '</div>';
    var hint = a.result;
    if(a.time) hint += '　' + a.time;
    if(a.rejectReason) hint += '<br><span style="color:#dc2626;">驳回原因：' + a.rejectReason + '</span>';
    html += '<div class="flow-node-hint">' + hint + '</div>';
    html += '</div></div>';
  });
  return html;
}

// 弹框关闭
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-mask').forEach(function(m) {
  m.addEventListener('click', function(e) { if(e.target === m) m.classList.remove('show'); });
});

// 初始化
window.addEventListener('load', function() {
  filterPending();
  filterProcessed();
  filterCC();
});
</script>
