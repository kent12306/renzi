<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增岗位</title>
  <link rel="stylesheet" href="../shared/prototype.css">
  <style>
    .position-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 32px;
      margin-bottom: 28px;
    }
    .position-form-grid label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color:#1d2733;
    }
    .position-form-grid input,
    .position-form-grid select {
      height: 36px;
      padding: 0 12px;
      border: 1px solid #e0e8ec;
      border-radius:6px;
      font-size: 14px;
      background: #fff;
      box-sizing: border-box;
    }
    .remark-label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color:#1d2733;
      margin-bottom: 32px;
    }
    .textarea-wrap { position: relative; }
    .textarea-wrap textarea {
      width: 100%;
      height: 120px;
      padding: 10px 12px;
      border: 1px solid #e0e8ec;
      border-radius:6px;
      font-size: 14px;
      resize: vertical;
      box-sizing: border-box;
    }
    .textarea-wrap .char-count {
      position: absolute;
      right: 10px;
      bottom: 8px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body data-module="employees">
  <main class="page-content" data-title="新增岗位" data-desc="新增岗位信息。">
    <section class="card form-page">

      <div class="position-form-grid">
        <label>岗位名称
          <input placeholder="请输入">
        </label>
        <label>所属部门
          <select>
            <option value="">选择部门</option>
            <option>技术部</option>
            <option>市场部</option>
            <option>运营部</option>
            <option>行政部</option>
            <option>人事部</option>
          </select>
        </label>
      </div>

      <label class="remark-label">岗位说明
        <div class="textarea-wrap">
          <textarea placeholder="请输入" maxlength="50"></textarea>
          <span class="char-count">0/50</span>
        </div>
      </label>

      <div class="page-actions">
        <a class="btn" href="./position-manage.html">取消</a>
        <a class="btn primary" href="./position-manage.html">保存</a>
      </div>

    </section>
  </main>
  <script src="../shared/nav.js"></script>
  <script>
    var ta = document.querySelector('textarea[maxlength="50"]');
    var counter = document.querySelector('.char-count');
    ta.addEventListener('input', function() {
      counter.textContent = ta.value.length + '/50';
    });
  </script>
</body>
</html>
